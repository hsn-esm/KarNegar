<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>کارنگار — پیش‌نمایش رابط کاربری</title>
<style>
  :root{
    color-scheme: light;
    --primary:#0F766E; --onPrimary:#fff; --primaryContainer:#7BE0C3; --onPrimaryContainer:#06403A;
    --secondary:#D97706; --tertiary:#0B6157;
    --error:#DC2626; --errorContainer:#FFC9C9;
    --bg:#F7F8F7; --surface:#fff; --surfaceVariant:#EDF1EF;
    --on:#14201C; --onVariant:#44514D; --outline:#BFCAC6; --outlineVariant:#DCE4E1;
    --morning:#2E9E7C; --afternoon:#2F6FB5; --evening:#B07A1E; --holiday:#9B4DCA; --night:#3F3D9E;
  }
  .dark{
    --primary:#7BE0C3; --onPrimary:#06403A; --primaryContainer:#13544B; --onPrimaryContainer:#7BE0C3;
    --secondary:#FCD9A1; --tertiary:#7BE0C3;
    --error:#FF8A80; --errorContainer:#6E1414;
    --bg:#0D1211; --surface:#151C1A; --surfaceVariant:#212B28;
    --on:#E6EDEA; --onVariant:#B6C2BE; --outline:#465350; --outlineVariant:#2C3634;
    --morning:#6FDCB6; --afternoon:#7FB0E8; --evening:#E8C06A; --holiday:#CB94EE; --night:#8F8CE8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#eceeef; color:#14201C; font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif; padding:28px 20px 48px}
  h1{font-size:22px; font-weight:700; text-align:center; margin-bottom:6px}
  .sub{text-align:center; color:#5a6764; font-size:13px; margin-bottom:26px}
  .rack{display:flex; flex-wrap:wrap; gap:26px; justify-content:center; align-items:flex-start}
  .item{width:320px}
  .cap{text-align:center; font-size:13px; color:#4a5754; margin-top:10px}
  .phone{width:320px; height:660px; border-radius:34px; padding:9px; background:#1b2220;
         box-shadow:0 14px 34px rgba(0,0,0,.22)}
  .screen{width:100%; height:100%; border-radius:26px; overflow:hidden; background:var(--bg);
          color:var(--on); display:flex; flex-direction:column; font-size:13px}
  .statusbar{height:22px; display:flex; align-items:center; justify-content:space-between;
             padding:0 14px; font-size:10px; color:var(--onVariant)}
  .topbar{padding:10px 16px 8px}
  .topbar .t{font-size:19px; font-weight:600}
  .topbar .s{font-size:11px; color:var(--onVariant); margin-top:2px}
  .body{flex:1; overflow:hidden; padding:4px 12px 8px; display:flex; flex-direction:column; gap:10px}
  .card{background:var(--surface); border:1px solid var(--outlineVariant); border-radius:18px; padding:12px}
  .nav{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .navbtn{width:34px; height:34px; border-radius:17px; background:var(--surfaceVariant);
          display:flex; align-items:center; justify-content:center; color:var(--primary); font-size:15px}
  .navttl{font-size:15px; font-weight:600}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); margin:10px 0 4px}
  .dow span{text-align:center; font-size:11px; font-weight:500; color:var(--onVariant)}
  .dow span:last-child{color:var(--error)}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  /* خانه فقط عدد شمسی و نقطه‌ی شیفت را دارد، پس مربع است و هیچ‌وقت جا کم نمی‌آورد */
  .cell{aspect-ratio:1; border-radius:12px; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:3px; position:relative}
  .cell .d{font-size:15px}
  .cell .dot{width:6px; height:6px; border-radius:3px}
  .cell .ov{position:absolute; top:4px; left:4px; width:5px; height:5px; border-radius:3px; background:var(--tertiary)}
  .off{background:color-mix(in srgb, var(--errorContainer) 45%, transparent)}
  .off .d{color:var(--error)}
  .today{outline:1.4px solid var(--primary); outline-offset:-1.4px; font-weight:700}
  .sel{background:var(--primary)}
  .sel .d{color:var(--onPrimary)}
  /* راهنما همیشه یک سطر است — مطابق Row با SpaceBetween در ShiftLegend */
  .legend{display:flex; flex-wrap:nowrap; justify-content:space-between; padding:2px 2px 0}
  .legend div{display:flex; align-items:center; gap:3px; font-size:10px; color:var(--onVariant); white-space:nowrap}
  .legend i{width:8px; height:8px; border-radius:4px; display:block}
  .tabs{display:flex; background:var(--surface); border-top:1px solid var(--outlineVariant);
        padding:6px 0 8px}
  .tab{flex:1; text-align:center; font-size:10px; color:var(--onVariant)}
  .tab .ic{display:flex; align-items:center; justify-content:center; height:26px; margin-bottom:3px}
  .tab.on{color:var(--primary); font-weight:700}
  .tab.on .ic{background:var(--primaryContainer); color:var(--onPrimaryContainer);
              border-radius:13px; width:56px; margin:0 auto 3px}
  .big{font-size:32px; font-weight:700; color:var(--primary); letter-spacing:.5px}
  .row{display:flex; align-items:center; justify-content:space-between; padding:6px 0}
  .row + .row{border-top:1px solid var(--outlineVariant)}
  .muted{color:var(--onVariant); font-size:11px}
  .bar{height:7px; border-radius:4px; background:var(--surfaceVariant); overflow:hidden; margin-top:5px}
  .bar i{display:block; height:100%; border-radius:4px}
  .pill{border:1px solid var(--outline); border-radius:14px; padding:5px 10px; font-size:11px}
  .pill.on{background:var(--primary); color:var(--onPrimary); border-color:var(--primary)}
  /* تراشه‌های نوع شیفت — پنج‌تا همیشه در یک سطر، مطابق ShiftTypeChip در اپ:
     نقطه‌ی رنگی بالای متن می‌نشیند تا تراشه باریک بماند */
  .types{display:flex; gap:6px; margin:8px 0}
  .types .t{flex:1; border:1px solid var(--outlineVariant); border-radius:8px;
            padding:7px 2px; display:flex; flex-direction:column; align-items:center; gap:3px;
            font-size:10px; color:var(--onVariant); white-space:nowrap}
  .types .t i{width:7px; height:7px; border-radius:4px; display:block}
  .types .t.on{color:var(--on); border-width:1.4px}
  .btn{border-radius:14px; padding:11px; text-align:center; font-size:13px; font-weight:600}
  .btn.fill{background:var(--primary); color:var(--onPrimary)}
  .btn.out{border:1px solid var(--primary); color:var(--primary)}
  .hdr3{display:flex; justify-content:space-between; font-size:10px; color:var(--onVariant)}
  .sect{font-size:12px; font-weight:600; margin-bottom:6px}
  table{width:100%; border-collapse:collapse; font-size:10px}
  th,td{padding:4px 3px; text-align:center; border-bottom:1px solid var(--outlineVariant)}
  th{background:var(--surfaceVariant); color:var(--onVariant); font-weight:600}
  .sheet{background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--outlineVariant);
         border-bottom:none; padding:12px; margin:0 -12px -8px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
  .badge{border-radius:8px; padding:5px 9px; font-size:10px}
</style>
</head>
<body>
<h1>کارنگار — پیش‌نمایش رابط کاربری</h1>
<p class="sub">این تصویر یک ماکت وفادار از رنگ‌ها، چیدمان و متن‌های واقعی اپ است (پالت و اندازه‌ها از Theme.kt و صفحه‌های Compose گرفته شده). تاریخ نمونه: ۳۱ مرداد ۱۴۰۵</p>
<div class="rack" id="rack"></div>
<script>
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]);
// شیفت‌های نمونه‌ی مرداد ۱۴۰۵
const SH = {1:'morning',3:'afternoon',4:'night',5:'evening',6:'morning',8:'morning',
  10:'evening',11:'afternoon',12:'night',13:'morning',17:'morning',18:'evening',
  19:'afternoon',20:'morning',23:'holiday',24:'morning',25:'night',26:'evening',
  27:'morning',31:'morning'};
const FRI = [2,9,16,23,30];      // جمعه‌ها — ۱ مرداد ۱۴۰۵ پنج‌شنبه است
// تعطیلات قمری مرداد ۱۴۰۵: اربعین (۲۰ صفر)، رحلت رسول اکرم (۲۸ صفر)،
// شهادت امام رضا (۲۹ صفر) و شهادت امام حسن عسکری (۸ ربیع‌الاول)
const HOL = [13,21,22,30];
const HOLNAME = {13:'اربعین حسینی',21:'رحلت رسول اکرم',22:'شهادت امام رضا',30:'شهادت امام حسن عسکری'};
const OVR = [12];                // تنظیم دستی تعطیلی
const LEADING = 5, DAYS = 31, TODAY = 31, SEL = 31;
// ۱ مرداد = ۸ صفر؛ صفر ۲۹ روزه است، پس از ۲۳ مرداد ربیع‌الاول شروع می‌شود
const hijri = n => n <= 22 ? n + 7 : n - 22;
const hijriMonth = n => n <= 22 ? 'صفر' : 'ربیع‌الاول';
// ۳۱ مرداد ۱۴۰۵ = 22 August 2026، پس ۱ مرداد = 23 July
const greg = n => n >= 10 ? n - 9 : n + 22;
const gregMonth = n => n >= 10 ? 'August' : 'July';

function cells() {
  let out = '';
  for (let i = 0; i < LEADING; i++) out += '<div class="cell"></div>';
  for (let d = 1; d <= DAYS; d++) {
    const off = FRI.includes(d) || HOL.includes(d);
    const cls = ['cell', d === SEL ? 'sel' : (off ? 'off' : ''), d === TODAY && d !== SEL ? 'today' : ''].join(' ');
    const s = SH[d];
    // خانه فقط عدد شمسی را دارد؛ قمری و میلادی در برگه‌ی جزئیات روز می‌آیند و
    // این tooltip معادلِ contentDescription صفحه‌خوان در DayCell است
    const ttl = ` title="${HOLNAME[d] ? HOLNAME[d] + ' — ' : ''}قمری ${fa(hijri(d))} ${hijriMonth(d)} — میلادی ${greg(d)} ${gregMonth(d)} 2026"`;
    out += `<div class="${cls}"${ttl}>` +
      (OVR.includes(d) ? '<span class="ov"></span>' : '') +
      `<span class="d">${fa(d)}</span>` +
      (s ? `<span class="dot" style="background:${d === SEL ? 'var(--onPrimary)' : 'var(--' + s + ')'}"></span>`
         : '<span class="dot" style="background:transparent"></span>') + '</div>';
  }
  return out;
}
const DOW = ['ش','ی','د','س','چ','پ','ج'].map(x => `<span>${x}</span>`).join('');
const LEG = [['morning','صبح'],['afternoon','بعدازظهر'],['evening','عصر'],['holiday','تعطیلی'],['night','شب']]
  .map(([k, t]) => `<div><i style="background:var(--${k})"></i>${t}</div>`).join('');
// آیکون‌های Material 3 — نسخه‌ی توپر برای تب فعال، خط‌دار برای بقیه
const ICONS = {
  calendar: {
    on: '<path d="M5 22q-.825 0-1.412-.587Q3 20.825 3 20V6q0-.825.588-1.412Q4.175 4 5 4h1V2h2v2h8V2h2v2h1q.825 0 1.413.588Q21 5.175 21 6v14q0 .825-.587 1.413Q19.825 22 19 22Zm0-2h14V10H5Zm7-5q-.425 0-.712-.288Q11 14.425 11 14t.288-.713Q11.575 13 12 13t.713.287Q13 13.575 13 14t-.287.712Q12.425 15 12 15Zm-4 0q-.425 0-.712-.288Q7 14.425 7 14t.288-.713Q7.575 13 8 13t.713.287Q9 13.575 9 14t-.287.712Q8.425 15 8 15Zm8 0q-.425 0-.712-.288Q15 14.425 15 14t.288-.713Q15.575 13 16 13t.713.287Q17 13.575 17 14t-.287.712Q16.425 15 16 15Zm-4 4q-.425 0-.712-.288Q11 18.425 11 18t.288-.712Q11.575 17 12 17t.713.288Q13 17.575 13 18t-.287.712Q12.425 19 12 19Zm-4 0q-.425 0-.712-.288Q7 18.425 7 18t.288-.712Q7.575 17 8 17t.713.288Q9 17.575 9 18t-.287.712Q8.425 19 8 19Zm8 0q-.425 0-.712-.288Q15 18.425 15 18t.288-.712Q15.575 17 16 17t.713.288Q17 17.575 17 18t-.287.712Q16.425 19 16 19Z"/>',
    off: '<path d="M5 22q-.825 0-1.412-.587Q3 20.825 3 20V6q0-.825.588-1.412Q4.175 4 5 4h1V2h2v2h8V2h2v2h1q.825 0 1.413.588Q21 5.175 21 6v14q0 .825-.587 1.413Q19.825 22 19 22Zm0-2h14V10H5Zm0-12h14V6H5Zm0 0V6v2Zm7 7q-.425 0-.712-.288Q11 14.425 11 14t.288-.713Q11.575 13 12 13t.713.287Q13 13.575 13 14t-.287.712Q12.425 15 12 15Zm-4 0q-.425 0-.712-.288Q7 14.425 7 14t.288-.713Q7.575 13 8 13t.713.287Q9 13.575 9 14t-.287.712Q8.425 15 8 15Zm8 0q-.425 0-.712-.288Q15 14.425 15 14t.288-.713Q15.575 13 16 13t.713.287Q17 13.575 17 14t-.287.712Q16.425 15 16 15Zm-4 4q-.425 0-.712-.288Q11 18.425 11 18t.288-.712Q11.575 17 12 17t.713.288Q13 17.575 13 18t-.287.712Q12.425 19 12 19Zm-4 0q-.425 0-.712-.288Q7 18.425 7 18t.288-.712Q7.575 17 8 17t.713.288Q9 17.575 9 18t-.287.712Q8.425 19 8 19Zm8 0q-.425 0-.712-.288Q15 18.425 15 18t.288-.712Q15.575 17 16 17t.713.288Q17 17.575 17 18t-.287.712Q16.425 19 16 19Z"/>'
  },
  insights: {
    on: '<path d="M3 21v-2h18v2Zm2-4V9h3v8Zm5 0V3h3v14Zm5 0v-6h3v6Z"/><path d="m5.5 8 6-6 3.5 3.5L20 1v2.5l-5 4.5-3.5-3.5L6 10Z"/>',
    off: '<path d="M3.4 18.6 2 17.2l8-8 3 3 5.6-5.6H16V4.6h5.4V10H19.6V7.9L13 14.5l-3-3Z"/>'
  },
  report: {
    on: '<path d="M5 21q-.825 0-1.412-.587Q3 19.825 3 19V5q0-.825.588-1.413Q4.175 3 5 3h14q.825 0 1.413.587Q21 4.175 21 5v14q0 .825-.587 1.413Q19.825 21 19 21Zm2-4h6v-2H7Zm0-4h10v-2H7Zm0-4h10V7H7Z"/>',
    off: '<path d="M7 17h6v-2H7Zm0-4h10v-2H7Zm0-4h10V7H7ZM5 21q-.825 0-1.412-.587Q3 19.825 3 19V5q0-.825.588-1.413Q4.175 3 5 3h14q.825 0 1.413.587Q21 4.175 21 5v14q0 .825-.587 1.413Q19.825 21 19 21Zm0-2h14V5H5v14Z"/>'
  },
  settings: {
    on: '<path d="M6 21v-6H4v-2h6v2H8v6Zm0-10V3h2v8Zm5 0V9h2V3h2v6h2v2Zm2 10v-8h2v8Zm5-10V3h2v8Zm0 10v-6h-2v-2h6v2h-2v6Z"/>',
    off: '<path d="M7 21v-5H5.5v-1.5h4V16H8v5Zm0-8V3h1v10Zm4.5 8v-5H10v-1.5h4V16h-1.5v5Zm0-8V9.5H10V8h1.5V3h1v5H14v1.5h-1.5V13Zm4.5 8v-9h-1.5v-1.5h4V12H17v9Zm0-12V3h1v6Z"/>'
  }
};
const ORDER = ['calendar', 'insights', 'report', 'settings'];
// فلش‌های ناوبری ماه — به‌جای نویسه‌های ‹ و › که در راست‌به‌چپ آینه می‌شوند
// و جهتشان برعکس دیده می‌شود، از SVG با جهت قطعی استفاده می‌شود.
// مسیر پایه به چپ اشاره می‌کند؛ CSS transform مستقل از dir است، پس «ماه قبل»
// که سمت راست می‌نشیند باید آینه شود تا به راست اشاره کند.
const ARROW = dir => `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="transform:scaleX(${dir === 'prev' ? -1 : 1})">
  <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20Z"/></svg>`;
// در dir=rtl اولین فرزند سمت راست می‌نشیند، پس «ماه قبل» راست است
const NAV = ttl => `<div class="nav"><div class="navbtn">${ARROW('prev')}</div>` +
  `<div class="navttl">${ttl}</div><div class="navbtn">${ARROW('next')}</div></div>`;
const svg = (k, on) => `<svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor">${ICONS[k][on ? 'on' : 'off']}</svg>`;
const tabs = sel => ORDER.map((k, i) =>
  `<div class="tab ${i === sel ? 'on' : ''}"><span class="ic">${svg(k, i === sel)}</span>${['تقویم','خلاصه کارکرد','گزارش گیری','تنظیمات'][i]}</div>`).join('');
const phone = (dark, inner, cap) => `<div class="item"><div class="phone"><div class="screen ${dark ? 'dark' : ''}">
  <div class="statusbar"><span>${fa('20:26')}</span><span>${fa('۹۸')}٪ ▮</span></div>${inner}</div></div>
  <div class="cap">${cap}</div></div>`;
// ---------- تب ۱: تقویم ----------
const calendar = `
<div class="topbar"><div class="t">تقویم کاری</div>
  <div class="s">امروز: شنبه ۳۱ مرداد ۱۴۰۵</div></div>
<div class="body">
  <div class="card">
    ${NAV('مرداد ۱۴۰۵')}
    <div class="dow">${DOW}</div>
    <div class="grid">${cells()}</div>
  </div>
  <!-- فقط پنج شیفت، همان‌طور که ShiftLegend در اپ نشان می‌دهد — یک سطر -->
  <div class="legend">${LEG}</div>
  <div class="card">
    <div class="sect">تعطیلات و مناسبت‌های این ماه</div>
    ${Object.keys(HOLNAME).map((d, i, a) =>
      `<div class="row"${i === a.length - 1 ? ' style="border:none"' : ''}>` +
      `<span class="muted">${HOLNAME[d]}</span><span>${fa(d)} مرداد</span></div>`).join('')}
  </div>
  <div class="card">
    <div class="hdr3"><span>شنبه ۳۱ مرداد ۱۴۰۵</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
      <div><div style="font-weight:600">شیفت صبح</div>
        <div class="muted">۰۷:۲۵ تا ۱۵:۱۰ — کارکرد ۷:۴۵</div></div>
      <div class="pill on">ویرایش</div>
    </div>
  </div>
</div>
<div class="tabs">${tabs(0)}</div>`;

// ---------- تب ۱ (حالت ثبت شیفت) ----------
const sheet = `
<div class="topbar"><div class="t">تقویم کاری</div><div class="s">ثبت شیفت روز انتخاب‌شده</div></div>
<div class="body">
  <div class="card" style="opacity:.45">
    ${NAV('مرداد ۱۴۰۵')}
    <div class="dow">${DOW}</div><div class="grid">${cells()}</div>
  </div>
  <div style="flex:1"></div>
  <div class="sheet">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 10px"></div>
    <div style="font-weight:600;margin-bottom:2px">شنبه ۳۱ مرداد ۱۴۰۵</div>
    <!-- قمری با سال، جداکننده، بعد میلادی — بخش لاتین با bdi یک تکه می‌ماند -->
    <div class="muted">۹ ربیع‌الاول ۱۴۴۸ - <bdi>22 August 2026</bdi></div>
    <div class="types">
      <div class="t on" style="border-color:var(--morning);background:rgba(46,158,124,.18)">
        <i style="background:var(--morning)"></i>صبح</div>
      <div class="t"><i style="background:var(--afternoon)"></i>بعدازظهر</div>
      <div class="t"><i style="background:var(--evening)"></i>عصر</div>
      <div class="t"><i style="background:var(--holiday)"></i>تعطیلی</div>
      <div class="t"><i style="background:var(--night)"></i>شب</div>
    </div>
    <div style="display:flex;gap:8px;margin:6px 0 8px">
      <div class="card" style="flex:1;padding:10px"><div class="muted">↳ ورود</div>
        <div style="font-size:19px;font-weight:700">۰۷:۲۵</div></div>
      <div class="card" style="flex:1;padding:10px"><div class="muted">↰ خروج</div>
        <div style="font-size:19px;font-weight:700">۱۵:۱۰</div></div>
    </div>
    <div class="row" style="border:none"><span class="muted">کارکرد محاسبه‌شده</span>
      <b style="color:var(--primary)">۷:۴۵</b></div>
    <div class="chips">
      <span class="badge" style="background:rgba(46,158,124,.12);color:var(--morning)">تعجیل در ورود ۰:۰۵</span>
      <span class="badge" style="background:rgba(217,119,6,.12);color:var(--secondary)">تاخیر در خروج ۰:۱۰</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <div class="btn fill" style="flex:1">ذخیره شیفت</div>
      <div class="btn out" style="width:96px;border-color:var(--error);color:var(--error)">حذف</div>
    </div>
  </div>
</div>
<div class="tabs">${tabs(0)}</div>`;
